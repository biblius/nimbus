[package]
name = "nimbus-server"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["postgres", "valkey"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs"]
sqlite = ["sqlx/sqlite"]
valkey = ["dep:deadpool-redis"]
memory-cache = []

[dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }
thiserror = "2.0.20"
clap = { version = "4.6.6", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-error = "0.2.1"
axum = { version = "0.8.9", features = ["multipart", "query", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
validify = "2.0.0"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "uuid", "migrate", "runtime-tokio", "derive", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
time = "0.3.55"
thotp = "0.1.11"
argon2 = "0.5.3"
zxcvbn = "3.1.1"
sha2 = "0.10.9"
hex = "0.4.3"
tokio-util = { version = "0.7.17", features = ["io"] }
futures = "0.3.34"
lettre = { version = "0.11.19", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
deadpool-redis = { version = "0.23.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
