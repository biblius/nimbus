[package]
name = "nimbus-server"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Production/release builds omit defaults when needed, e.g.:
#   cargo build --release --no-default-features --features postgres,valkey
default = ["postgres", "valkey"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs"]
sqlite = ["sqlx/sqlite"]
valkey = ["dep:deadpool-redis"]
memory-cache = []

[dependencies]
tokio = { version = "1.53.3", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "net",
  "fs",
  "io-util",
] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-error = "0.2.1"
axum = { version = "0.8.9", features = ["multipart", "query", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
rust-embed = "8.11.0"
mime_guess = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
validify = "2.0.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "uuid",
  "migrate",
  "runtime-tokio",
  "derive",
  "macros",
  "json",
] }
chrono = { version = "0.4.45", features = ["serde"] }
time = "0.3.55"
thotp = "0.1.11"
argon2 = "0.6.0"
zxcvbn = "3.1.1"
sha2 = "0.11.1"
hex = "0.4.3"
tokio-util = { version = "0.7.20", features = ["io", "compat"] }
futures = "0.3.34"
lettre = { version = "0.11.23", default-features = false, features = [
  "smtp-transport",
  "tokio1-rustls-tls",
  "builder",
  "hostname",
] }
deadpool-redis = { version = "0.23.1", optional = true }
serde_with = "3.24.0"
infer = "0.22.0"
tokio-stream = "0.1.19"
image = "0.25.10"
webauthn-rs = { version = "0.5.5", features = [
  # Used ONLY to serialize the state on the server during registration /
  # discoverable authentication. Serialized state is never sent to clients.
  "danger-allow-state-serialisation",
  # Usermameless passkey login via start/finish_discoverable_authentication.
  "conditional-ui",
] }
async_zip = { version = "0.0.19", default-features = false, features = [
  "tokio",
  "deflate",
] }

[dev-dependencies]
suitest = "0.1.4"
testcontainers = "0.28.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
