name: Release Nimbus desktop
on:
  push:
    branches:
      - release
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-desktop
  cancel-in-progress: false
jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect version bump
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          version="$(python3 -c "import json; print(json.load(open('client/desktop/src-tauri/tauri.conf.json'))['version'])")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' client/desktop/src-tauri/Cargo.toml | head -n1)"

          if [[ -z "$version" ]]; then
            echo "Could not read version from client/desktop/src-tauri/tauri.conf.json" >&2
            exit 1
          fi

          if [[ "$version" != "$cargo_version" ]]; then
            echo "Desktop version mismatch: tauri.conf.json=${version} Cargo.toml=${cargo_version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing Nimbus desktop v${version}"
            exit 0
          fi

          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "First commit on branch: releasing Nimbus desktop v${version}"
            exit 0
          fi

          old="$(git show HEAD^:client/desktop/src-tauri/tauri.conf.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" || true)"

          if [[ "$version" == "$old" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged (${version}); skipping release"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Version bumped ${old:-none} -> ${version}; releasing"
  publish-tauri:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./client/desktop/src-tauri -> target"
      - name: Install frontend dependencies
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_KEY }}
        with:
          projectPath: client/desktop
          tagName: nimbus-desktop-v__VERSION__
          releaseName: Nimbus desktop v__VERSION__
          releaseBody: See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          makeLatest: true
          args: ${{ matrix.args }}
