name: Release nimbus-server
on:
  push:
    branches:
      - release
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-server
  cancel-in-progress: false
jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect version bump
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -n1)"

          if [[ -z "$version" ]]; then
            echo "Could not read version from server/Cargo.toml" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing nimbus-server v${version}"
            exit 0
          fi

          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "First commit on branch: releasing nimbus-server v${version}"
            exit 0
          fi

          old="$(git show HEAD^:server/Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1 || true)"

          if [[ "$version" == "$old" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged (${version}); skipping release"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Version bumped ${old:-none} -> ${version}; releasing"
  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        feature: [sqlite, postgres]
        platform:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            pkg-config \
            libssl-dev
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build embedded web UI
        env:
          VITE_NIMBUS_URL: /api
        run: npm run build -w @nimbus/web
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: server-${{ matrix.platform.target }}-${{ matrix.feature }}
      - name: Build nimbus-server
        run: |
          cargo build --release -p nimbus-server \
            --target "${{ matrix.platform.target }}" \
            --no-default-features \
            --features "${{ matrix.feature }}"
      - name: Package binary
        run: |
          set -euo pipefail

          bin="target/${{ matrix.platform.target }}/release/nimbus-server"

          asset="nimbus-server-${{ matrix.platform.target }}-${{ matrix.feature }}"

          strip "$bin"

          cp "$bin" "$asset"

          tar -czf "${asset}.tar.gz" "$asset"

          sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-server-${{ matrix.platform.target }}-${{ matrix.feature }}
          path: |
            nimbus-server-${{ matrix.platform.target }}-${{ matrix.feature }}.tar.gz
            nimbus-server-${{ matrix.platform.target }}-${{ matrix.feature }}.tar.gz.sha256
          if-no-files-found: error
  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nimbus-server-*
          merge-multiple: true
      - name: Write VERSION file
        run: echo "${{ needs.check-version.outputs.version }}" > dist/VERSION
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nimbus-server
          name: nimbus-server v${{ needs.check-version.outputs.version }}
          body: |
            Release of `nimbus-server` v${{ needs.check-version.outputs.version }}.

            Assets include SQLite and Postgres builds for:

            - `x86_64-unknown-linux-gnu`
            - `aarch64-unknown-linux-gnu`

            Download: `https://github.com/${{ github.repository }}/releases/download/nimbus-server/<asset>.tar.gz`
          files: dist/*
          fail_on_unmatched_files: true
          # Desktop owns GitHub "latest" for the auto-updater manifest (latest.json).
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
